        // Initialize

            autoSelectZodiac();

            const navLinks = document.getElementById('nav-links');
            if (navToggle && navLinks) {
                navToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navLinks.classList.toggle('active');
                });
                
                navLinks.addEventListener('click', function(e) {
                    if (e.target.tagName === 'A') {
                        navLinks.classList.remove('active');
                    }
                });
                
                document.addEventListener('click', function(e) {
                    if (!navLinks.contains(e.target) && !navToggle.contains(e.target)) {
                        navLinks.classList.remove('active');
                    }
                });
            }
        });

        // Render Zodiac Grid
        function renderZodiacGrid() {
            const grid = document.getElementById('zodiacGrid');
            let html = '';

            for (const key in zodiacKnowledge) {
                const zodiac = zodiacKnowledge[key];
                html += `
                    <div class="zodiac-card" onclick="selectZodiac('${key}')">
                        <span class="zodiac-icon">${zodiac.icon}</span>
                        <div class="zodiac-name">${zodiac.name}</div>
                        <div class="zodiac-date">${zodiac.dateRange}</div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        // Select Zodiac
        function selectZodiac(key) {
            selectedZodiac = key;
            showResult();
        }

        // Show Result
        function showResult() {
            if (!selectedZodiac) return;

            const zodiac = zodiacKnowledge[selectedZodiac];

            // Update header
            document.getElementById('resultIcon').textContent = zodiac.icon;
            document.getElementById('resultName').textContent = zodiac.name;
            document.getElementById('resultDate').textContent = zodiac.dateRange;

            // Render basic info
            document.getElementById('basicInfo').innerHTML = `
                <div class="basic-info-item">
                    <span class="basic-info-label">元素：</span>
                    <span class="basic-info-value">${zodiac.element}</span>
                </div>
                <div class="basic-info-item">
                    <span class="basic-info-label">守护星：</span>
                    <span class="basic-info-value">${zodiac.planet}</span>
                </div>
                <div class="basic-info-item">
                    <span class="basic-info-label">幸运数字：</span>
                    <span class="basic-info-value">${zodiac.luckyNumber.join(', ')}</span>
                </div>
                <div class="basic-info-item">
                    <span class="basic-info-label">方位：</span>
                    <span class="basic-info-value">${zodiac.direction}</span>
                </div>
            `;

            // Render traits
            renderTraits(zodiac.traits);

            // Render compatibility
            renderCompatibility(selectedZodiac);

            // Render lucky guide
            renderLuckyTips(zodiac.lucky);

            // Render myth
            document.getElementById('mythContent').textContent = zodiac.myth;

            // Render celebrities
            renderCelebrities(zodiac.celebrities);

            // Show fortune (default to daily)
            showFortune('daily');

            // Switch page
            switchPage('page-result');

        // Switch Page
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(function(page) {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderTraits(traits) {

            traits.positive.forEach(function(trait) {
                html += `<span class="trait-tag trait-positive">${trait}</span>`;
            });

            traits.negative.forEach(function(trait) {
                html += `<span class="trait-tag trait-negative">${trait}</span>`;
            });

            document.getElementById('traitsContainer').innerHTML = html;
        }

        // Render Compatibility
        function renderCompatibility(key) {
            const zodiac = zodiacKnowledge[key];
            const comp = zodiac.compatibility;

            const getZodiacName = function(k) {
                return zodiacKnowledge[k] ? zodiacKnowledge[k].name : k;
            };

            let html = `
                <div class="compatibility-section">
                    <div class="compatibility-label compatibility-level-high">最佳配对</div>
                    <div class="compatibility-list">
                        ${comp.high.map(function(k) { return `<span class="compatibility-item">${getZodiacName(k)}</span>`; }).join('')}
                    </div>
                </div>
                <div class="compatibility-section">
                    <div class="compatibility-label compatibility-level-medium">良好配对</div>
                    <div class="compatibility-list">
                        ${comp.medium.map(function(k) { return `<span class="compatibility-item">${getZodiacName(k)}</span>`; }).join('')}
                    </div>
                </div>
                <div class="compatibility-section">
                    <div class="compatibility-label compatibility-level-low">一般配对</div>
                    <div class="compatibility-list">
                        ${comp.low.map(function(k) { return `<span class="compatibility-item">${getZodiacName(k)}</span>`; }).join('')}
                    </div>
                </div>
            `;

            document.getElementById('compatibilityContainer').innerHTML = html;
        }

        // Render Lucky Tips
        function renderLuckyTips(lucky) {
            const icons = ['🔢', '🎨', '💎', '🌸', '🍽️'];
            const labels = ['幸运数字', '幸运颜色', '幸运宝石', '幸运花卉', '幸运食物'];
            const values = [lucky.number.join(', '), lucky.color, lucky.gem, lucky.flower, lucky.food];

            let html = '';
            for (let i = 0; i < labels.length; i++) {
                html += `
                    <div class="lucky-item">
                        <span class="lucky-icon">${icons[i]}</span>
                        <span class="lucky-text"><strong>${labels[i]}:</strong> ${values[i]}</span>
                    </div>
                `;
            }

            document.getElementById('luckyGuide').innerHTML = html;
        }

        // Render Celebrities
        function renderCelebrities(list) {
            let html = '';

            list.forEach(function(name) {
                html += `
                    <div class="celebrity-item">
                        <div class="celebrity-avatar">${name.charAt(0)}</div>
                        <div class="celebrity-name">${name}</div>
                    </div>
                `;
            });

            document.getElementById('celebritiesGrid').innerHTML = html;
        }

        // Auto Select Zodiac based on current date
        function autoSelectZodiac() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();

            let zodiacKey = '';

            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) {
                zodiacKey = 'aries';
            } else if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) {
                zodiacKey = 'taurus';
            } else if ((month === 5 && day >= 21) || (month === 6 && day <= 21)) {
                zodiacKey = 'gemini';
            } else if ((month === 6 && day >= 22) || (month === 7 && day <= 22)) {
                zodiacKey = 'cancer';
            } else if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) {
                zodiacKey = 'leo';
            } else if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) {
                zodiacKey = 'virgo';
            } else if ((month === 9 && day >= 23) || (month === 10 && day <= 23)) {
                zodiacKey = 'libra';
            } else if ((month === 10 && day >= 24) || (month === 11 && day <= 22)) {
                zodiacKey = 'scorpio';
            } else if ((month === 11 && day >= 23) || (month === 12 && day <= 21)) {
                zodiacKey = 'sagittarius';
            } else if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) {
                zodiacKey = 'capricorn';
            } else if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) {
                zodiacKey = 'aquarius';
            } else {
                zodiacKey = 'pisces';
            }

            // Highlight the current zodiac card
            setTimeout(function() {
                const cards = document.querySelectorAll('.zodiac-card');
                const keys = Object.keys(zodiacKnowledge);
                const index = keys.indexOf(zodiacKey);
                if (index !== -1 && cards[index]) {
                    cards[index].style.borderColor = 'rgba(155, 89, 182, 0.6)';
                    cards[index].style.background = 'rgba(155, 89, 182, 0.15)';
                }
            }, 100);
        }

        // Show Fortune (Core Function)
        function showFortune(type, zodiacId) {
            if (!zodiacId) {
                zodiacId = selectedZodiac;
            }

            if (!zodiacId) return;

            const zodiac = zodiacKnowledge[zodiacId];
            const fortune = zodiac[type];

            if (!fortune) return;

            // Update tab states
            document.querySelectorAll('.fortune-tab').forEach(function(tab) {
                tab.classList.remove('active');
                if (tab.dataset.type === type) {
                    tab.classList.add('active');
                }
            });

            // Get score color based on value
            const getScoreColor = function(value) {
                if (value >= 85) return '#2ECC71';
                if (value >= 70) return '#F39C12';
                return '#E74C3C';
            };

            // Render fortune content
            const labels = ['综合', '爱情', '事业', '财富', '健康'];
            const values = [fortune.overall, fortune.love, fortune.career, fortune.wealth, fortune.health];

            let scoresHtml = '';
            for (let i = 0; i < labels.length; i++) {
                scoresHtml += `
                    <div class="fortune-score-item">
                        <div class="fortune-score-label">${labels[i]}</div>
                        <div class="fortune-score-value">${values[i]}</div>
                        <div class="fortune-score-bar">
                            <div class="fortune-score-fill" style="width: ${values[i]}%; background: ${getScoreColor(values[i])};"></div>
                        </div>
                    </div>
                `;
            }

            const contentHtml = `
                <div class="fortune-scores">
                    ${scoresHtml}
                </div>
                <div class="fortune-summary">
                    ${fortune.summary}
                </div>
                <div class="fortune-advice">
                    ${fortune.advice}
                </div>
            `;

            document.getElementById('fortuneContent').innerHTML = contentHtml;

            // Animate score bars
            setTimeout(function() {
                document.querySelectorAll('.fortune-score-fill').forEach(function(fill) {
                    fill.style.width = fill.style.width;
                });
            }, 100);
        }

        // Restart
        function restart() {
            selectedZodiac = null;
            switchPage('page-intro');
        }

        // Share Functions
        function shareTo(platform) {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent('我的星座档案 - 趣味测试');
            const zodiac = selectedZodiac ? zodiacKnowledge[selectedZodiac].name : '星座';

            let shareUrl = '';

            switch (platform) {
                case 'weibo':
                    shareUrl = `http://service.weibo.com/share/share.php?url=${url}&title=${title}`;
                    break;
                case 'qq':
                    shareUrl = `https://connect.qq.com/widget/shareqq/index.html?url=${url}&title=${title}`;
                    break;
                default:
                    showToast('分享功能开发中...');
                    return;
            }

            window.open(shareUrl, '_blank', 'width=600,height=400');
        }

        function copyToClipboard() {
            const text = `我发现了一个超有趣的星座测试网站！快来查看你的星座档案吧：${window.location.href}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('链接已复制到剪贴板！');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast('链接已复制到剪贴板！');
            } catch (err) {
                showToast('复制失败，请手动复制');
            }

            document.body.removeChild(textarea);
        }

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');

            setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
